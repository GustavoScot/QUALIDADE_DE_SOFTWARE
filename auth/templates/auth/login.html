<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-screen flex overflow-hidden">

  <!-- Left panel: login card -->
  <div class="flex-1 flex items-center justify-center bg-white px-8">
    <div class="w-full max-w-sm">

      <!-- Logo -->
      <div class="flex items-center gap-2 mb-10">
        <div class="w-7 h-7 bg-black rounded-md flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 2a8 8 0 100 16A8 8 0 0010 2z"/>
          </svg>
        </div>
        <span class="font-semibold text-sm">Biblioteca</span>
      </div>

      <h1 class="text-2xl font-bold text-gray-900 mb-1">Login to your account</h1>
      <p class="text-sm text-gray-500 mb-6">Enter your email below to login to your account</p>

      <!-- Error message (hidden by default) -->
      <div id="error-msg"
        class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2">
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input id="email" type="email" placeholder="m@example.com"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent" />
      </div>

      <!-- Password -->
      <div class="mb-5">
        <div class="flex justify-between items-center mb-1">
          <label class="text-sm font-medium text-gray-700">Password</label>
          <a href="#" class="text-sm text-gray-500 hover:underline">Forgot your password?</a>
        </div>
        <input id="password" type="password"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent" />
      </div>

      <!-- Login button -->
      <button id="btn-login" onclick="handleEmailLogin()"
        class="w-full bg-black text-white text-sm font-medium py-2 rounded-md
               hover:bg-gray-800 transition-colors flex items-center justify-center gap-2
               disabled:opacity-50 disabled:cursor-not-allowed">
        Login
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-4">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400">Or continue with</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- Google button -->
      <button id="btn-google" onclick="handleGoogleLogin()"
        class="w-full border border-gray-300 text-sm font-medium py-2 rounded-md
               hover:bg-gray-50 transition-colors flex items-center justify-center gap-2
               disabled:opacity-50 disabled:cursor-not-allowed">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Login with Google
      </button>

      <p class="text-center text-sm text-gray-500 mt-5">
        Don't have an account?
        <span class="underline cursor-default text-gray-400">Sign up</span>
      </p>
    </div>
  </div>

  <!-- Right panel: decorative -->
  <div class="hidden md:flex flex-1 bg-gray-100 items-center justify-center">
    <div class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center">
      <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14
             m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
    </div>
  </div>

  <!-- Firebase JS SDK v12.12.1 — all imports must use the same version -->
  <script type="module">
    import { initializeApp }
      from 'https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signInWithPopup,
             GoogleAuthProvider, signOut }
      from 'https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js';

    const firebaseConfig = {
      apiKey:     "{{ firebase_api_key }}",
      authDomain: "{{ firebase_auth_domain }}",
      projectId:  "{{ firebase_project_id }}",
    };

    const fbApp = initializeApp(firebaseConfig);
    const auth  = getAuth(fbApp);
    const googleProvider = new GoogleAuthProvider();

    const ERROR_MESSAGES = {
      'auth/wrong-password':         'Senha incorreta.',
      'auth/invalid-credential':     'Senha incorreta.',
      'auth/user-not-found':         'Nenhuma conta encontrada com este e-mail.',
      'auth/invalid-email':          'E-mail inválido.',
      'auth/too-many-requests':      'Muitas tentativas. Tente novamente mais tarde.',
      'auth/network-request-failed': 'Erro de conexão. Verifique sua internet.',
      'auth/popup-closed-by-user':   'Login cancelado.',
    };

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error-msg').classList.add('hidden');
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      if (loading) {
        btn.innerHTML = `
          <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10"
              stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
          </svg>`;
      } else {
        if (btnId === 'btn-login') {
          btn.innerHTML = 'Login';
        } else {
          btn.innerHTML = `
            <svg class="w-4 h-4" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Login with Google`;
        }
      }
    }

    async function sendTokenToFlask(user) {
      const idToken = await user.getIdToken();
      const res = await fetch('/auth/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken }),
      });
      const data = await res.json();
      if (data.status === 'ok') {
        await signOut(auth);
        window.location.href = '/';
      } else {
        showError(data.message || 'Erro ao fazer login. Tente novamente.');
      }
    }

    window.handleEmailLogin = async function () {
      hideError();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      setLoading('btn-login', true);
      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        await sendTokenToFlask(result.user);
      } catch (e) {
        showError(ERROR_MESSAGES[e.code] || 'Erro ao fazer login. Tente novamente.');
      } finally {
        setLoading('btn-login', false);
      }
    };

    window.handleGoogleLogin = async function () {
      hideError();
      setLoading('btn-google', true);
      try {
        const result = await signInWithPopup(auth, googleProvider);
        await sendTokenToFlask(result.user);
      } catch (e) {
        showError(ERROR_MESSAGES[e.code] || 'Erro ao fazer login. Tente novamente.');
      } finally {
        setLoading('btn-google', false);
      }
    };

    window.logout = async function () {
      await signOut(auth);
      window.location.href = '/auth/logout';
    };
  </script>
</body>
</html>
